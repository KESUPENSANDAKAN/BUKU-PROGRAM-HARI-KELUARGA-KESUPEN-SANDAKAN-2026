<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063b82"><title>Buku Program HARI KELUARGA KESUPEN SANDAKAN 2026</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#071b35;color:#fff}
#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#155aa8 0,#071b35 70%)}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(2,19,43,.92);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid rgba(255,255,255,.12)}
.title{font-weight:700;font-size:14px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:7px;align-items:center}button{border:0;border-radius:10px;background:#fff;color:#07356f;padding:8px 11px;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.count{font-size:13px;min-width:55px;text-align:center}
#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:12px 12px 68px;touch-action:none}
#book{position:relative;width:min(100%,calc((100vh - 150px)*595/842));aspect-ratio:595/842;box-shadow:0 18px 50px rgba(0,0,0,.5);border-radius:3px;overflow:hidden;background:#fff;flex:0 0 auto}
.page{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:translateX(4%);transition:opacity .28s ease,transform .28s ease}.page.active{opacity:1;transform:translateX(0)}
#bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:flex;align-items:center;gap:9px;padding:9px 12px;background:rgba(2,19,43,.9);border:1px solid rgba(255,255,255,.13);border-radius:16px;backdrop-filter:blur(8px)}
#slider{flex:1}.hint{font-size:11px;opacity:.7;text-align:center;padding:0 10px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#071b35;z-index:10;font-weight:700}.hide{display:none!important}
@media(max-width:600px){header{height:52px;padding:0 9px}.title{font-size:12px}.controls button{padding:7px 9px}.hint{display:none}#stage{padding:8px 8px 60px}}
</style></head><body><div id="app"><header><div class="title">📖 HARI KELUARGA KESUPEN SANDAKAN 2026</div><div class="controls"><button id="prev">‹</button><div class="count" id="count">1 / 12</div><button id="next">›</button><button id="fs">⛶</button></div></header><main id="stage"><div id="loading">Memuatkan ebook…</div><div id="book"></div><div id="bar"><div class="hint">Swipe kiri/kanan • ← → • klik butang</div><input id="slider" type="range" min="1" max="12" value="1" aria-label="Pilih halaman"></div></main></div>
<script>
const pages=[...Array(12)].map((_,n)=>`page-${String(n+1).padStart(2,"0")}.jpg`);const book=document.getElementById('book'), count=document.getElementById('count'), slider=document.getElementById('slider'), prev=document.getElementById('prev'), next=document.getElementById('next'), fs=document.getElementById('fs'), loading=document.getElementById('loading');
let i=0, startX=null;
pages.forEach((src,n)=>{const im=document.createElement('img');im.className='page'+(n===0?' active':'');im.src=src;im.alt='Halaman '+(n+1);book.appendChild(im)});
function show(n){i=Math.max(0,Math.min(pages.length-1,n));document.querySelectorAll('.page').forEach((p,k)=>p.classList.toggle('active',k===i));count.textContent=(i+1)+' / '+pages.length;slider.value=i+1;prev.disabled=i===0;next.disabled=i===pages.length-1}
prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);slider.oninput=e=>show(+e.target.value-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);if(e.key==='Home')show(0);if(e.key==='End')show(pages.length-1)});
book.addEventListener('pointerdown',e=>startX=e.clientX);book.addEventListener('pointerup',e=>{if(startX==null)return;let dx=e.clientX-startX;if(Math.abs(dx)>45)show(i+(dx<0?1:-1));startX=null});
fs.onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
const first=document.querySelector('.page'); if(first.complete){loading.classList.add('hide')} else {first.addEventListener('load',()=>loading.classList.add('hide'),{once:true}); first.addEventListener('error',()=>{loading.textContent='Gambar tidak dapat dimuatkan. Semak fail page-01.jpg';},{once:true})} show(0);
</script></body></html>
