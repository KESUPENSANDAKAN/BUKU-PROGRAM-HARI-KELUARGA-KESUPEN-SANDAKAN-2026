<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HARI KELUARGA KESUPEN SANDAKAN 2026 — Flipbook</title>
<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#071a2b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 12px 12px}
.book{position:relative;width:min(92vw,520px);height:min(82vh,780px);perspective:2200px;touch-action:pan-y}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform .75s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden;box-shadow:0 18px 45px rgba(0,0,0,.45);background:#fff}
.face img{width:100%;height:100%;display:block;object-fit:cover}
.back{transform:rotateY(180deg)}
.page9{position:absolute}.qr-link{position:absolute;left:15.9%;top:78.5%;width:15.2%;height:10.2%;z-index:10;display:block;cursor:pointer;background:transparent}.qr-link:focus{outline:3px solid rgba(255,255,255,.95);outline-offset:3px;border-radius:6px}

.controls{display:flex;gap:10px;align-items:center;margin-top:14px}
button{border:0;border-radius:999px;padding:10px 17px;font-weight:700;background:#fff;color:#06213a;font-size:15px}
button:disabled{opacity:.35}
.count{min-width:70px;text-align:center;font-weight:700}
.hint{font-size:12px;opacity:.75;margin-top:8px;text-align:center}
@media (max-height:700px){.book{height:78vh}}
</style>
</head>
<body>
<div class="wrap">
<div class="book" id="book">
<div class="sheet" data-i="1"><div class="face"><img src="page_01.jpg" alt="Page 1"></div><div class="face back"><img src="page_02.jpg" alt="Page 2"></div></div><div class="sheet" data-i="3"><div class="face"><img src="page_03.jpg" alt="Page 3"></div><div class="face back"><img src="page_04.jpg" alt="Page 4"></div></div><div class="sheet" data-i="5"><div class="face"><img src="page_05.jpg" alt="Page 5"></div><div class="face back"><img src="page_06.jpg" alt="Page 6"></div></div><div class="sheet" data-i="7"><div class="face"><img src="page_07.jpg" alt="Page 7"></div><div class="face back"><img src="page_08.jpg" alt="Page 8"></div></div><div class="sheet" data-i="9"><div class="face page9"><img src="page_09.jpg" alt="Page 9"><a class="qr-link" href="https://www.google.com/maps/dir/?api=1&destination=5.994123%2C117.909835&travelmode=driving" target="_blank" rel="noopener noreferrer" aria-label="Buka laluan Google Maps ke Pantai Dandulit"></a></div><div class="face back"><img src="page_10.jpg" alt="Page 10"></div></div><div class="sheet" data-i="11"><div class="face"><img src="page_11.jpg" alt="Page 11"></div><div class="face back"><img src="page_12.jpg" alt="Page 12"></div></div>
</div>
<div class="controls">
<button id="prev">‹ Sebelum</button><div class="count" id="count">1 / 12</div><button id="next">Seterusnya ›</button>
</div>
<div class="hint">Tekan butang atau klik/leret halaman untuk membalik. Pada Page 9, tekan QR untuk buka Google Maps.</div>
</div>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
let page=1;
const count=document.getElementById('count'), prev=document.getElementById('prev'), next=document.getElementById('next');
function render(){
  sheets.forEach((s,idx)=>s.classList.toggle('flipped', idx < Math.floor((page-1)/2)));
  count.textContent=page+' / 12';
  prev.disabled=page<=1; next.disabled=page>=12;
}
function go(n){page=Math.max(1,Math.min(12,n));render()}
prev.onclick=()=>go(page-1); next.onclick=()=>go(page+1);
sheets.forEach((s,idx)=>s.onclick=(e)=>{if(e.target.closest(".qr-link")) return; go(Math.min(12, page+2));});
let sx=0;
document.getElementById('book').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.getElementById('book').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40) go(page+(dx<0?1:-1));});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1);});
render();
</script>
</body></html>
